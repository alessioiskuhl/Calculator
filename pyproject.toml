[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "alessio-calculator"
version = "1.0.0"
description = "A small Python library for basic mathematical calculations."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Alessio"}
]

[tool.setuptools.packages.find]
where = ["src"]
[project.scripts]
calculator = "calculator.cli:main"